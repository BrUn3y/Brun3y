<svg width="1200" height="260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="tg1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(110,20,210,0.4)" />
      <stop offset="70%" stop-color="rgba(90,15,180,0)" />
    </radialGradient>
    <style>
      @keyframes float-slow {
        0%, 100% { transform: translateY(0px); opacity: 0.8; }
        50% { transform: translateY(-20px); opacity: 1.2; }
      }
      #tech-glow { animation: float-slow 8s ease-in-out infinite; }
      .tech-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
  </defs>
  
  <rect width="1200" height="260" fill="url(#grad1)" rx="16"/>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="260" fill="none" stroke="rgba(110,80,220,0.18)" stroke-width="1" rx="16"/>
  
  <ellipse id="tech-glow" cx="600" cy="130" rx="400" ry="150" fill="url(#tg1)" />
  
  <!-- Title -->
  <text x="60" y="80" class="tech-title" font-size="32" font-weight="900" fill="#ffffff" letter-spacing="-1">Tech Stack</text>
  
  <!-- CORE Section -->
  <text x="60" y="125" class="tech-title" font-size="18" font-weight="700" fill="rgba(180,165,255,0.95)" letter-spacing="1">CORE</text>
  <text x="60" y="150" class="tech-title" font-size="16" font-weight="400" fill="rgba(255,255,255,0.85)" letter-spacing="0.3">Java · TypeScript · Python · Node.js · React</text>
  
  <!-- CLOUD Section -->
  <text x="60" y="185" class="tech-title" font-size="18" font-weight="700" fill="rgba(180,165,255,0.95)" letter-spacing="1">CLOUD</text>
  <text x="60" y="210" class="tech-title" font-size="16" font-weight="400" fill="rgba(255,255,255,0.85)" letter-spacing="0.3">IBM Cloud · AWS · GCP · Docker · Linux</text>
  
  <!-- AI LAB Section -->
  <text x="60" y="245" class="tech-title" font-size="18" font-weight="700" fill="rgba(180,165,255,0.95)" letter-spacing="1">AI LAB</text>
  <text x="60" y="270" class="tech-title" font-size="16" font-weight="400" fill="rgba(255,255,255,0.85)" letter-spacing="0.3">IBM Watson · IBM Bob · BeeAI · Gemini · Claude</text>
</svg>