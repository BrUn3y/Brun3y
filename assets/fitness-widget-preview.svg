<svg width="800" height="280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="stepsGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#81C784;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="caloriesGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF5722;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8A65;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="activeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#64B5F6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="800" height="280" rx="16" fill="url(#cardGradient)" filter="url(#shadow)"/>
  
  <!-- Header -->
  <text x="40" y="50" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#ffffff">
    🏃 Fitness Stats
  </text>
  <text x="40" y="75" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#b0b0b0">
    Aug 10 - Aug 16, 2026
  </text>
  
  <!-- Steps Card -->
  <g transform="translate(40, 110)">
    <rect width="220" height="130" rx="12" fill="#252525"/>
    <circle cx="30" cy="30" r="20" fill="url(#stepsGradient)" opacity="0.2"/>
    <text x="30" y="36" font-size="24" text-anchor="middle" fill="url(#stepsGradient)">👟</text>
    <text x="70" y="28" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#b0b0b0">Steps</text>
    <text x="70" y="55" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="700" fill="#ffffff">1,057</text>
    <rect x="10" y="90" width="200" height="4" rx="2" fill="#3a3a3a"/>
    <rect x="10" y="90" width="3" height="4" rx="2" fill="url(#stepsGradient)"/>
    <text x="10" y="115" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#808080">Daily avg: 151</text>
  </g>
  
  <!-- Calories Card -->
  <g transform="translate(290, 110)">
    <rect width="220" height="130" rx="12" fill="#252525"/>
    <circle cx="30" cy="30" r="20" fill="url(#caloriesGradient)" opacity="0.2"/>
    <text x="30" y="36" font-size="24" text-anchor="middle" fill="url(#caloriesGradient)">🔥</text>
    <text x="70" y="28" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#b0b0b0">Calories</text>
    <text x="70" y="55" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="700" fill="#ffffff">0</text>
    <rect x="10" y="90" width="200" height="4" rx="2" fill="#3a3a3a"/>
    <rect x="10" y="90" width="0" height="4" rx="2" fill="url(#caloriesGradient)"/>
    <text x="10" y="115" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#808080">Daily avg: 0</text>
  </g>
  
  <!-- Active Minutes Card -->
  <g transform="translate(540, 110)">
    <rect width="220" height="130" rx="12" fill="#252525"/>
    <circle cx="30" cy="30" r="20" fill="url(#activeGradient)" opacity="0.2"/>
    <text x="30" y="36" font-size="24" text-anchor="middle" fill="url(#activeGradient)">⏱️</text>
    <text x="70" y="28" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#b0b0b0">Active Minutes</text>
    <text x="70" y="55" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="700" fill="#ffffff">15</text>
    <rect x="10" y="90" width="200" height="4" rx="2" fill="#3a3a3a"/>
    <rect x="10" y="90" width="1" height="4" rx="2" fill="url(#activeGradient)"/>
    <text x="10" y="115" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#808080">Daily avg: 2</text>
  </g>
  
  <!-- Footer -->
  <text x="40" y="265" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#606060">
    Last updated: 2026-08-10 20:13 UTC • Data source: Google Health API (Fitbit)
  </text>
</svg>
