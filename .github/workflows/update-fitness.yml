name: Update Fitness Widget

on:
  schedule:
    # Run every Sunday at 05:23 UTC
    - cron: '23 5 * * 0'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-fitness:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client requests
      
      - name: Create token.json from secret
        working-directory: ./google-health-api-setup
        run: |
          echo '${{ secrets.GOOGLE_HEALTH_TOKEN }}' > token.json
      
      - name: Create Strava tokens from secret
        working-directory: ./strava-setup
        run: |
          echo '${{ secrets.STRAVA_TOKENS }}' > strava_tokens.json
      
      - name: Update fitness widget in readme.source.md
        working-directory: ./google-health-api-setup
        run: |
          python update_fitness_widget.py
      
      - name: Update Strava activities in readme.source.md
        run: |
          python update_strava_activities.py
      
      - name: Build README with readme-aura
        run: |
          npx readme-aura build
      
      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add readme.source.md README.md .github/assets/
          git diff --quiet && git diff --staged --quiet || (git commit -m "🏃 Update fitness stats with DarkOrbs style [automated]" && git push)