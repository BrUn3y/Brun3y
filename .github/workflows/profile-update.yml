name: Update Profile

on:
  schedule:
    - cron: "23 5 * * 0" # weekly, Sundays 05:23 UTC
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  # Generate a contribution-graph snake from *your own* activity
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Rebuild the Medium article cards from the latest RSS feed
  medium-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/gen_medium_cards.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh Medium cards"
          file_pattern: assets/medium/*.svg

  # Refresh Google Health API (Fitbit) stats in the profile README on the same schedule
  fitness-widget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: profile-repo
      - uses: actions/checkout@v4
        with:
          repository: BrUn3y/google-health-api-setup
          token: ${{ secrets.GITHUB_TOKEN }}
          path: health-repo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r health-repo/requirements.txt
      - name: Create Google Health API token
        env:
          GOOGLE_HEALTH_TOKEN: ${{ secrets.GOOGLE_HEALTH_TOKEN }}
        run: |
          printf '%s' "$GOOGLE_HEALTH_TOKEN" > health-repo/token.json
          python3 -m json.tool health-repo/token.json > /dev/null
      - run: |
          cd health-repo
          python update_fitness_widget.py
      - name: Create Strava tokens and refresh
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: |
          cd profile-repo
          # Force token refresh to get valid access_token
          RESPONSE=$(curl -s -X POST https://www.strava.com/oauth/token \
            -d client_id="$STRAVA_CLIENT_ID" \
            -d client_secret="$STRAVA_CLIENT_SECRET" \
            -d refresh_token="$STRAVA_REFRESH_TOKEN" \
            -d grant_type=refresh_token)
          
          ACCESS_TOKEN=$(echo "$RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin)['access_token'])")
          EXPIRES_AT=$(echo "$RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin)['expires_at'])")
          NEW_REFRESH_TOKEN=$(echo "$RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin)['refresh_token'])")
          
          cat > strava_tokens.json << EOF
          {
            "client_id": "$STRAVA_CLIENT_ID",
            "client_secret": "$STRAVA_CLIENT_SECRET",
            "access_token": "$ACCESS_TOKEN",
            "refresh_token": "$NEW_REFRESH_TOKEN",
            "expires_at": $EXPIRES_AT
          }
          EOF
      - run: |
          cd profile-repo
          pip install requests
          python update_strava_widget.py
          python update_strava_activities.py
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/fitness-widget.svg readme.source.md
          if [ -f assets/strava-widget.svg ]; then git add assets/strava-widget.svg; fi
          git diff --quiet && git diff --staged --quiet || (git commit -m "🏃 Update fitness stats and Strava activities [automated]" && git push)
      - name: Trigger README generation
        if: success()
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: regenerate-readme