name: Update Profile

on:
  schedule:
    - cron: "23 5 * * 0" # weekly, Sundays 05:23 UTC
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  # Generate a contribution-graph snake from *your own* activity
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Rebuild the Medium article cards from the latest RSS feed
  medium-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/gen_medium_cards.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh Medium cards"
          file_pattern: assets/medium/*.svg

  # Refresh Google Fit stats in the profile README on the same schedule
  fitness-widget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: profile-repo
      - uses: actions/checkout@v4
        with:
          repository: BrUn3y/google-fit-api-setup
          token: ${{ secrets.GITHUB_TOKEN }}
          path: fitness-repo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client
      - name: Create and validate Google Fit token
        env:
          GOOGLE_FIT_TOKEN: ${{ secrets.GOOGLE_FIT_TOKEN }}
        run: |
          printf '%s' "$GOOGLE_FIT_TOKEN" > fitness-repo/token.json
          python3 -m json.tool fitness-repo/token.json > /dev/null
      - run: python fitness-repo/update_fitness_widget.py
        env:
          README_PATH: profile-repo/README.md
      - run: |
          cd profile-repo
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "🏃 Update fitness stats [automated]" && git push)
