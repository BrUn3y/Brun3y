name: Deploy personal website to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'index.html'
      - 'agent.md'
      - 'AGENTS.md'
      - 'site/**'
      - 'assets/strava-widget.svg'
      - 'scripts/refresh_site_data.py'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '41 6 * * *'
  workflow_run:
    workflows: ['Update Profile', 'Update Fitness Widget']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-website
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh public GitHub and published Strava data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/refresh_site_data.py --best-effort
      - name: Assemble public website
        run: |
          mkdir -p _site
          cp index.html agent.md AGENTS.md _site/
          cp -R site _site/site
          touch _site/.nojekyll
      - name: Publish to root GitHub Pages repository
        uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b # v4
        with:
          deploy_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          external_repository: BrUn3y/BrUn3y.github.io
          publish_branch: main
          publish_dir: ./_site
          enable_jekyll: false
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: 'Publish personal website'
